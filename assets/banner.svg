<text x="600" y="150" text-anchor="middle" font-size="104" font-weight="800" fill="url(#title)" font-family="'Segoe UI',system-ui,sans-serif" letter-spacing="-2">ytdl-lite
<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
<text x="600" y="215" text-anchor="middle" font-size="26" fill="#cbd5ff" font-family="'Segoe UI',system-ui,sans-serif" letter-spacing="1" opacity="0">Download. Search. Inspect.
