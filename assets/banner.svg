<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="ytdl-lite" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0f0c29"><animate attributeName="stop-color" values="#0f0c29;#1b1147;#0a1a3d;#0f0c29" dur="12s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#302b63"><animate attributeName="stop-color" values="#302b63;#1d2b64;#3b1c6e;#302b63" dur="12s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="title" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#ff4d6d"/><stop offset="0.5" stop-color="#ffb86b"/><stop offset="1" stop-color="#7c5cff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-400 0;400 0;-400 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="round"><rect width="1200" height="330" rx="24"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1200" height="330" fill="url(#bg)"/>
<rect width="1200" height="330" fill="url(#grid)"/>
<g filter="url(#blur)">
<circle r="110" fill="#ff4d6d" opacity="0.45"><animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="80;250;80" dur="11s" repeatCount="indefinite"/></circle>
<circle r="130" fill="#7c5cff" opacity="0.5"><animate attributeName="cx" values="1020;780;1020" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="250;70;250" dur="10s" repeatCount="indefinite"/></circle>
<circle r="90" fill="#00d4ff" opacity="0.35"><animate attributeName="cx" values="600;680;520;600" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="300;240;310;300" dur="9s" repeatCount="indefinite"/></circle>
</g>
<g fill="#ffffff">
<circle cx="120" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="340" cy="270" r="1.6"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="1110" cy="180" r="1.6"><animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="300" r="1.8"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
</g>
